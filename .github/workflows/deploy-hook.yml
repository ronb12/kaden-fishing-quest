name: Deploy Hook

# Trigger existing Vercel project via deploy hook (no token needed).
# Add secret VERCEL_DEPLOY_HOOK from:
# Vercel → kaden-fishing-quest → Settings → Git → Deploy Hooks

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
