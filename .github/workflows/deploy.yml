name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify API modules load
        run: node -e "import('./api/progress.js').then(() => console.log('API OK'))"

  # Vercel auto-deploys via Git integration when connected.
  # Set DATABASE_URL in Vercel project env (Neon integration recommended).
