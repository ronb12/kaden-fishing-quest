name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify API modules load
        run: node -e "import('./api/progress.js').then(() => console.log('API OK'))"

  # Deploys to existing project: kaden-fishing-quest
  # https://kaden-fishing-quest-ronell-bradleys-projects.vercel.app
  #
  # Requires GitHub secrets (Settings → Secrets and variables → Actions):
  #   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  #
  # Faster alternative: reconnect Git in Vercel (no secrets needed):
  #   Vercel → kaden-fishing-quest → Settings → Git → ronb12/kaden-fishing-quest
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Vercel secrets are configured
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Missing VERCEL_TOKEN secret. Add it at https://github.com/ronb12/kaden-fishing-quest/settings/secrets/actions"
            echo "Or reconnect Git in Vercel: https://vercel.com → kaden-fishing-quest → Settings → Git"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID. Run 'npx vercel link --project kaden-fishing-quest' locally and copy values from .vercel/project.json"
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
