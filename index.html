<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaden VR Fishing Quest</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="hud" class="hud">
      <div class="hud-brand">
        <span class="hud-title">Kaden VR Fishing</span>
      </div>
      <div class="hud-stats">
        <span>🐟 <strong id="hud-fish">0</strong></span>
        <span>🪙 <strong id="hud-coins">50</strong></span>
        <span>🎣 Rod <strong id="hud-rod">1</strong></span>
        <span>⛵ Boat <strong id="hud-boat">1</strong></span>
        <span>📍 <strong id="hud-zone">Lake Dock</strong></span>
        <span>🪱 <strong id="hud-bait">Nightcrawler</strong></span>
      </div>
      <p id="status-text" class="status-text">Click lake to look · Space to cast</p>
    </div>

    <div id="tension-bar" class="tension-bar">
      <label>Tension</label>
      <div class="bar-track"><div id="tension-fill" class="bar-fill tension-fill"></div></div>
      <label>Reel</label>
      <div class="bar-track"><div id="reel-progress" class="bar-fill reel-fill"></div></div>
    </div>

    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open menu">☰</button>

    <aside id="vr-menu" class="vr-menu">
      <header class="menu-header">
        <h2>Fishing Menu</h2>
        <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
      </header>
      <nav class="menu-tabs">
        <button class="active" type="button" data-panel="help">Help</button>
        <button type="button" data-panel="zones">Zones</button>
        <button type="button" data-panel="codex">Codex</button>
        <button type="button" data-panel="gear">Gear</button>
        <button type="button" data-panel="bait">Bait</button>
        <button type="button" data-panel="quests">Quests</button>
        <button type="button" data-panel="leaderboard">Board</button>
      </nav>
      <div id="panel-content" class="panel-content"></div>
    </aside>

    <div id="catch-overlay" class="catch-overlay"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div class="loading-hint">
      <p>WebXR VR supported on Quest, Vision Pro, and desktop VR headsets.</p>
      <p>Desktop: click to look · WASD move · Space cast · R reel · M menu · B bait</p>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
