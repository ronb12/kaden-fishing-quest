<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kaden VR Fishing Quest">
  <defs>
    <linearGradient id="bg" x1="96" y1="48" x2="416" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a3550"/>
      <stop offset="42%" stop-color="#0d4f73"/>
      <stop offset="78%" stop-color="#0f86a8"/>
      <stop offset="100%" stop-color="#ffc96a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#ffe8a8" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#ffd37a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffd37a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="100%" stop-color="#6ec4e8"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ed4f0"/>
      <stop offset="45%" stop-color="#0f86a8"/>
      <stop offset="100%" stop-color="#0a5570"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#d8dde8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061018" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon safe area: keep key art inside ~432px with 40px inset -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sunGlow)"/>

  <!-- distant shore -->
  <path d="M0 248c88-36 176-48 256-38s176 34 256 18v304H0z" fill="#083248" fill-opacity=".42"/>

  <!-- water body -->
  <ellipse cx="256" cy="332" rx="228" ry="108" fill="url(#waterTop)" fill-opacity=".94"/>
  <ellipse cx="256" cy="318" rx="196" ry="34" fill="#ffffff" fill-opacity=".22"/>
  <path d="M72 318c52-18 116-28 184-28s132 10 184 28" fill="none" stroke="#0d4f73" stroke-width="8" stroke-linecap="round" opacity=".35"/>

  <!-- subtle VR lens rings (top-left, integrated) -->
  <g opacity=".88">
    <circle cx="118" cy="118" r="52" fill="none" stroke="#ffffff" stroke-width="10" opacity=".18"/>
    <circle cx="118" cy="118" r="34" fill="none" stroke="#7ee8ff" stroke-width="6" opacity=".35"/>
    <circle cx="118" cy="118" r="10" fill="#ffd37a" opacity=".85"/>
  </g>

  <!-- fishing rod -->
  <g filter="url(#shadow)">
    <path d="M392 88 C360 148 318 210 268 268" fill="none" stroke="#0c1f2f" stroke-width="14" stroke-linecap="round" opacity=".22"/>
    <path d="M392 88 C360 148 318 210 268 268" fill="none" stroke="url(#rod)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="392" cy="88" r="18" fill="#c49a6c" stroke="#8b6340" stroke-width="4"/>
    <circle cx="392" cy="88" r="8" fill="#e8c9a0"/>
  </g>

  <!-- line + bobber -->
  <g filter="url(#shadow)">
    <path d="M268 268 C252 286 244 302 244 322" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".95"/>
    <ellipse cx="244" cy="328" rx="22" ry="17" fill="#ffffff"/>
    <ellipse cx="244" cy="338" rx="22" ry="17" fill="#e84545"/>
    <rect x="240" y="312" width="8" height="18" rx="3" fill="#ffffff"/>
    <ellipse cx="244" cy="328" rx="30" ry="10" fill="#ffffff" fill-opacity=".28"/>
  </g>

  <!-- hero fish -->
  <g filter="url(#shadow)">
    <path d="M168 356 C132 356 104 372 88 398 C112 424 148 438 184 438 C228 438 268 416 296 378 C264 360 224 356 184 356 Z" fill="url(#fishBody)" stroke="#0c1f2f" stroke-width="10" stroke-linejoin="round"/>
    <path d="M88 398 L48 428 L62 372 Z" fill="#0f86a8" stroke="#0c1f2f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M196 368 C214 356 236 352 258 358" fill="none" stroke="#7ee8ff" stroke-width="8" stroke-linecap="round" opacity=".75"/>
    <circle cx="214" cy="384" r="14" fill="#ffffff"/>
    <circle cx="220" cy="384" r="6" fill="#0c1f2f"/>
    <path d="M248 392 C268 400 286 414 298 432" fill="none" stroke="#5ed4f0" stroke-width="7" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- water sparkle -->
  <g fill="#ffffff" opacity=".75">
    <circle cx="148" cy="302" r="4"/>
    <circle cx="332" cy="294" r="3"/>
    <circle cx="380" cy="318" r="2.5"/>
  </g>

  <!-- bottom vignette for depth -->
  <path d="M0 420 Q256 480 512 420 L512 512 L0 512 Z" fill="#061018" fill-opacity=".12"/>
</svg>
